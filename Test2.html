        // FULL INTEGRATED MAIN.C SOURCE CODE (Cleaned of Non-breaking spaces for Keil compatibility)
        const rawFullSourceCode = `/**************************************************************************//**
 * @file     main.c
 * @version  V1.00
 * @brief    I2C temperature reading from NCT7712Y + Timer PWM LED breathing.
 * When temperature > 27 C, the breathing LED is faster.
 *
 * SPDX-License-Identifier: Apache-2.0

#include <stdio.h>
#include <string.h>
#include "NuMicro.h"
#include "Common.h"

/*---------------------------------------------------------------------------------------------------------*/
/* DMA Descriptor Structure                                                                                */
/*---------------------------------------------------------------------------------------------------------*/
typedef struct dma_desc_t
{
    uint32_t ctl;
    uint32_t src;
    uint32_t dest;
    uint32_t offset;
} DMA_DESC_T;

/*---------------------------------------------------------------------------------------------------------*/
/* Macro Definitions                                                                                       */
/*---------------------------------------------------------------------------------------------------------*/
/* I2C PDMA channels */
#define I2C0_PDMA_TX_CH    0
#define I2C0_PDMA_RX_CH    1
#define PWM_PDMA_CH        2

/* I2C scatter-gather parameters */
#define SG_TX_TAB_NUM      1
#define SG_RX_TAB_NUM      5
#define SG_TX_LENGTH       3
#define SG_RX_LENGTH       2
#define SG_BASE_ADDR       0x20000000

/* PWM breathing parameters */
#define PWM_PDMA_LENGTH    7

/*---------------------------------------------------------------------------------------------------------*/
/* Global Variables                                                                                        */
/*---------------------------------------------------------------------------------------------------------*/
uint8_t SrcArray[SG_TX_LENGTH * SG_TX_TAB_NUM];
uint8_t DestArray[SG_RX_LENGTH * SG_RX_TAB_NUM];
uint32_t SrcArray_PWM[PWM_PDMA_LENGTH];

DMA_DESC_T DMA_DESC_SC_TX[SG_TX_TAB_NUM];
DMA_DESC_T DMA_DESC_SC_RX[SG_RX_TAB_NUM];
DMA_DESC_T DMA_DESC_PWM[1];                        /* PWM scatter-gather descriptor (single, circular) */

typedef void (*I2C_FUNC)(uint32_t u32Status);
volatile static I2C_FUNC s_I2C0HandlerFn = NULL;

uint32_t NCT7712Y_Data = 0;
float NCT7712Y_Data_F = 0;
volatile uint32_t PDMA_DONE = 0;
uint8_t g_u8DeviceAddr = 0x48;
uint32_t PWM_PERIOD_Value;

/* Breathing LED software divider (ISR-driven, no PDMA) */
volatile uint32_t g_u32PWMIdx = 0;
volatile uint32_t g_u32BreathDiv = 10;     /* Number of ISR calls per duty step */
volatile uint32_t g_u32BreathCnt = 0;

/*---------------------------------------------------------------------------------------------------------*/
/* Function: Build_Tx_SCTab                                                                                */
/* Purpose : Build scatter-gather descriptor table for I2C0 TX PDMA channel                                */
/*---------------------------------------------------------------------------------------------------------*/
void Build_Tx_SCTab(uint32_t u32TabNum, uint32_t u32TxSize, uint32_t u32StartAddr)
{
    uint32_t i;

    for (i = 0; i < u32TabNum; i++)
    {
        DMA_DESC_SC_TX[i].ctl = PDMA_OP_SCATTER |
                                PDMA_REQ_SINGLE |
                                PDMA_DAR_FIX |
                                PDMA_SAR_INC |
                                PDMA_WIDTH_8 |
                                PDMA_TBINTDIS_DISABLE |
                                ((u32TxSize - 1) << PDMA_DSCT_CTL_TXCNT_Pos);
        DMA_DESC_SC_TX[i].src    = (uint32_t)(u32StartAddr + i * u32TxSize);
        DMA_DESC_SC_TX[i].dest   = (uint32_t)&(I2C0->DAT);
        DMA_DESC_SC_TX[i].offset = (uint32_t)&DMA_DESC_SC_TX[0] - SG_BASE_ADDR;
    }
}

/*---------------------------------------------------------------------------------------------------------*/
/* Function: Build_Rx_SCTab                                                                                */
/* Purpose : Build scatter-gather descriptor table for I2C0 RX PDMA channel; last entry uses basic mode    */
/*---------------------------------------------------------------------------------------------------------*/
void Build_Rx_SCTab(uint32_t u32TabNum, uint32_t u32RxSize, uint32_t u32StartAddr)
{
    uint32_t i;

    for (i = 0; i < u32TabNum; i++)
    {
        DMA_DESC_SC_RX[i].ctl = PDMA_OP_SCATTER |
                                PDMA_REQ_SINGLE |
                                PDMA_SAR_FIX |
                                PDMA_DAR_INC |
                                PDMA_WIDTH_8 |
                                PDMA_TBINTDIS_DISABLE |
                                ((u32RxSize - 1) << PDMA_DSCT_CTL_TXCNT_Pos);
        DMA_DESC_SC_RX[i].src    = (uint32_t)&(I2C0->DAT);
        DMA_DESC_SC_RX[i].dest   = (uint32_t)(u32StartAddr + i * u32RxSize);
        DMA_DESC_SC_RX[i].offset = (uint32_t)&DMA_DESC_SC_RX[0] + 0x10 * (i + 1) - (PDMA0->SCATBA);
    }

    /* For the last entry: enable transfer-done interrupt and switch to basic mode */
    DMA_DESC_SC_RX[u32TabNum - 1].ctl = (DMA_DESC_SC_RX[u32TabNum - 1].ctl & ~(PDMA_DSCT_CTL_TBINTDIS_Msk | PDMA_DSCT_CTL_OPMODE_Msk)) |
                                        (PDMA_TBINTDIS_ENABLE | PDMA_OP_BASIC);
    DMA_DESC_SC_RX[u32TabNum - 1].offset = 0;
}

/*---------------------------------------------------------------------------------------------------------*/
/* I2C0 IRQ Handler                                                                                        */
/*---------------------------------------------------------------------------------------------------------*/
void I2C0_IRQHandler(void)
{
    uint32_t u32Status;

    u32Status = I2C_GET_STATUS(I2C0);

    if (I2C_GET_TIMEOUT_FLAG(I2C0))
    {
        /* Clear I2C0 timeout flag */
        I2C_ClearTimeoutFlag(I2C0);
    }
    else
    {
        if (s_I2C0HandlerFn != NULL)
            s_I2C0HandlerFn(u32Status);
    }
}

/*---------------------------------------------------------------------------------------------------------*/
/* Function: I2C_PDMA_MasterRx                                                                             */
/* Purpose : I2C0 PDMA Master Rx callback; handles bus states during auto-operation random read            */
/*---------------------------------------------------------------------------------------------------------*/
void I2C_PDMA_MasterRx(uint32_t u32Status)
{
    if (u32Status == 0x08)                             /* START has been transmitted */
    {
        /* During PDMA operation, I2C will not generate START interrupt */
    }
    else if (u32Status == 0x18)                        /* SLA+W ACK */
    {
        /* During PDMA operation, I2C will not generate address ACK interrupt */
    }
    else if (u32Status == 0x20)                        /* SLA+W NACK */
    {
        I2C_STOP(I2C0);
        I2C_START(I2C0);
    }
    else if (u32Status == 0x28)                        /* DATA ACK */
    {
        /* During PDMA operation, I2C will not generate data ACK interrupt */
    }
    else if (u32Status == 0x10)                        /* Repeat START */
    {
    }
    else if (u32Status == 0x40)                        /* SLA+R ACK */
    {
        /* During PDMA operation, I2C will not generate address ACK interrupt */
    }
    else if (u32Status == 0x50)                        /* DATA received ACK */
    {
        /* During PDMA operation, I2C will not generate receive data ACK interrupt */
    }
    else if (u32Status == 0x58)                        /* DATA received NACK */
    {
        /* During Auto operation, I2C will not generate receive data NACK interrupt */
    }
    else
    {
        printf("Status 0x%x is NOT processed\\n", u32Status);
    }
}

/*---------------------------------------------------------------------------------------------------------*/
/* PDMA0 IRQ Handler                                                                                       */
/*---------------------------------------------------------------------------------------------------------*/
void PDMA0_IRQHandler(void)
{
    uint32_t u32Status = PDMA0->TDSTS;

    /* I2C RX channel done */
    if (u32Status & (0x1 << I2C0_PDMA_RX_CH))
    {
        PDMA0->TDSTS = 0x1 << I2C0_PDMA_RX_CH;
        PDMA_DONE = 1;
    }

    /* PWM PDMA channel done - just clear flag */
    if (u32Status & (0x1 << PWM_PDMA_CH))
    {
        PDMA0->TDSTS = 0x1 << PWM_PDMA_CH;
    }
}

/*---------------------------------------------------------------------------------------------------------*/
/* TMR0 IRQ Handler — update PWM duty for breathing LED via software divider                              */
/*---------------------------------------------------------------------------------------------------------*/
void TMR0_IRQHandler(void)
{
    if (TIMER0->PWMAINTSTS & TIMER_PWMAINTSTS_IFAIF_Msk)
    {
        /* Clear accumulator interrupt flag */
        TIMER0->PWMAINTSTS = TIMER_PWMAINTSTS_IFAIF_Msk;

        if (++g_u32BreathCnt >= g_u32BreathDiv)
        {
            g_u32BreathCnt = 0;
            TIMER0->PWMCMPDAT = SrcArray_PWM[g_u32PWMIdx];
            g_u32PWMIdx = (g_u32PWMIdx + 1) % PWM_PDMA_LENGTH;
        }
    }
}

/*---------------------------------------------------------------------------------------------------------*/
/* Function: I2C_Init                                                                                      */
/* Purpose : Open I2C0 at 100kHz and enable I2C0 interrupt                                                 */
/*---------------------------------------------------------------------------------------------------------*/
void I2C_Init(void)
{
    /* Open I2C0 module and set bus clock to 100kHz */
    I2C_Open(I2C0, 100000);

    /* Enable I2C0 interrupt */
    I2C_EnableInt(I2C0);
    NVIC_EnableIRQ(I2C0_IRQn);
}

/*---------------------------------------------------------------------------------------------------------*/
/* Function: TIMER_Init                                                                                    */
/* Purpose : Configure TIMER1 as periodic 1Hz with LIRC for I2C auto-operation trigger                     */
/*---------------------------------------------------------------------------------------------------------*/
void TIMER_Init(void)
{
    /* Open TIMER1 to periodic mode, 1 Hz */
    TIMER_Open(TIMER1, TIMER_PERIODIC_MODE, 1);

    /* Enable TIMER1 Power-down engine clock */
    TIMER1->CTL |= TIMER_CTL_PDCLKEN_Msk;

    /* Set TIMER1 to trigger I2C when timeout */
    TIMER_SetATriggerSource(TIMER1, TIMER_ATRGSRC_TIMEOUT_EVENT);

    /* Enable TIMER1 to trigger Other Peripheral (IPS) */
    TIMER_SetATriggerTarget(TIMER1, TIMER_ATRG_TO_IPS);

    /* Disable CPU wake-up by timer */
    TIMER_DisableWakeup(TIMER1);
}

/*---------------------------------------------------------------------------------------------------------*/
/* Function: Timer_PWM_Init                                                                                */
/* Purpose : Configure TIMER0 PWM at 100Hz on PB5, accumulator + PDMA                                      */
/*---------------------------------------------------------------------------------------------------------*/
void Timer_PWM_Init(void)
{
    /* Switch TIMER0 to PWM mode */
    TPWM_ENABLE_PWM_MODE(TIMER0);

    /* Enable PWM output on CH0 (PB5) */
    TPWM_ENABLE_OUTPUT(TIMER0, TPWM_CH0);

    /* Set frequency 100Hz, 0% initial duty */
    TPWM_ConfigOutputFreqAndDuty(TIMER0, 100, 0);

    /* Read actual period count from register */
    PWM_PERIOD_Value = TIMER0->PWMPERIOD + 1;

    /* Enable Power-down engine clock */
    TIMER0->CTL |= TIMER_CTL_PDCLKEN_Msk;

    /* Keep PWM active in debug mode */
    SYS_UnlockReg();
    TIMER0->PWMCTL |= TIMER_PWMCTL_DBGTRIOFF_Msk;
    SYS_LockReg();

    /* Enable accumulator: IFACNT=0 means fire every 1 period (100 ISR/sec at 100Hz PWM) */
    TPWM_EnableAcc(TIMER0, 0, TPWM_IFA_PERIOD_POINT);

    /* Enable accumulator interrupt (software divider controls breathing speed) */
    TPWM_EnableAccInt(TIMER0);
    NVIC_EnableIRQ(TMR0_IRQn);
}

/*---------------------------------------------------------------------------------------------------------*/
/* Function: PDMA_TX_Init                                                                                  */
/* Purpose : Configure PDMA channel for I2C0 TX in scatter-gather mode                                     */
/*---------------------------------------------------------------------------------------------------------*/
void PDMA_TX_Init(uint8_t u8TestCh, uint32_t u32TabNum, uint32_t u32TestLen)
{
    PDMA_Open(PDMA0, 1 << u8TestCh);

    /* Setup Scatter-gather table for TX transfer */
    Build_Tx_SCTab(u32TabNum, u32TestLen, (uint32_t)&SrcArray);

    PDMA_SetTransferMode(PDMA0, u8TestCh, PDMA_I2C0_TX, 1, (uint32_t)&DMA_DESC_SC_TX[0]);
}

/*---------------------------------------------------------------------------------------------------------*/
/* Function: PDMA_RX_Init                                                                                  */
/* Purpose : Configure PDMA channel for I2C0 RX in scatter-gather mode; enable transfer-done interrupt     */
/*---------------------------------------------------------------------------------------------------------*/
void PDMA_RX_Init(uint8_t u8TestCh, uint32_t u32TabNum, uint32_t u32TestLen)
{
    PDMA_Open(PDMA0, 1 << u8TestCh);

    /* Setup Scatter-gather table for RX transfer */
    Build_Rx_SCTab(u32TabNum, u32TestLen, (uint32_t)&DestArray);

    PDMA_SetTransferMode(PDMA0, u8TestCh, PDMA_I2C0_RX, 1, (uint32_t)&DMA_DESC_SC_RX[0]);

    /* Enable channel transfer done interrupt */
    PDMA_EnableInt(PDMA0, I2C0_PDMA_RX_CH, PDMA_INT_TRANS_DONE);
    NVIC_EnableIRQ(PDMA0_IRQn);
}

/*---------------------------------------------------------------------------------------------------------*/
/* Function: Build_PWM_SCTab                                                                               */
/* Purpose : Build a single scatter-gather descriptor for Timer0 PWM PDMA (circular, SAR_INC)              */
/* Transfers 7 words from SrcArray_PWM[] to PWMCMPDAT, one per trigger, then loops.              */
/*---------------------------------------------------------------------------------------------------------*/
void Build_PWM_SCTab(void)
{
    DMA_DESC_PWM[0].ctl = PDMA_OP_SCATTER |
                          PDMA_REQ_SINGLE |
                          PDMA_SAR_INC |               /* Increment through SrcArray_PWM[0..6] */
                          PDMA_DAR_FIX |               /* Destination: TIMER0->PWMCMPDAT (fixed) */
                          PDMA_WIDTH_32 |
                          PDMA_TBINTDIS_DISABLE |
                          ((PWM_PDMA_LENGTH - 1) << PDMA_DSCT_CTL_TXCNT_Pos);  /* 7 transfers */
    DMA_DESC_PWM[0].src    = (uint32_t)&SrcArray_PWM[0];
    DMA_DESC_PWM[0].dest   = (uint32_t)&(TIMER0->PWMCMPDAT);
    DMA_DESC_PWM[0].offset = (uint32_t)&DMA_DESC_PWM[0] - (PDMA0->SCATBA);  /* Circular: point to self */
}

/*---------------------------------------------------------------------------------------------------------*/
/* Function: PDMA_PWM_Init                                                                                 */
/* Purpose : Configure PDMA channel for Timer0 PWM duty updates (scatter-gather circular mode)             */
/*---------------------------------------------------------------------------------------------------------*/
void PDMA_PWM_Init(void)
{
    /* Reset PDMA CH2 to clear any stale state */
    PDMA_RESET(PDMA0, PWM_PDMA_CH);
    PDMA_Open(PDMA0, 1 << PWM_PDMA_CH);

    /* Build single circular scatter-gather descriptor */
    Build_PWM_SCTab();

    /* Set transfer mode: scatter-gather, triggered by PDMA_TMR0 */
    PDMA_SetTransferMode(PDMA0, PWM_PDMA_CH, PDMA_TMR0, 1, (uint32_t)&DMA_DESC_PWM[0]);
}

/*---------------------------------------------------------------------------------------------------------*/
/* Function: I2C_Trigger_Init                                                                              */
/* Purpose : Configure I2C0 auto-operation mode, trigger source, and RX/TX byte count                      */
/*---------------------------------------------------------------------------------------------------------*/
void I2C_Trigger_Init(uint32_t u32Mode, uint32_t u32Src, uint32_t u32RxCnt, uint32_t u32TxCnt)
{
    /* Set Auto-operation Mode */
    I2C0->AUTOCTL = (I2C0->AUTOCTL & ~I2C_AUTOCTL_AUTOMODE_Msk) | (u32Mode);

    /* Trigger source select */
    I2C0->AUTOCTL = (I2C0->AUTOCTL & ~I2C_AUTOCTL_TGSRCSEL_Msk) | (u32Src);

    I2C0->AUTOCNT = (I2C0->AUTOCNT & ~(I2C_AUTOCNT_RXCNT_Msk | I2C_AUTOCNT_TXCNT_Msk));

    if (u32RxCnt != 0)
        I2C0->AUTOCNT |= ((u32RxCnt - 1) << I2C_AUTOCNT_RXCNT_Pos);

    if (u32TxCnt != 0)
        I2C0->AUTOCNT |= ((u32TxCnt - 1) << I2C_AUTOCNT_TXCNT_Pos);

    I2C0->AUTOCTL |= I2C_AUTOCTL_TRGEN_Msk;
}

/*---------------------------------------------------------------------------------------------------------*/
/* Function: AutoOperation_FunctionTest                                                                    */
/* Purpose : Main test function: setup PDMA transfers, enter power-down, decode temperature on wakeup      */
/*---------------------------------------------------------------------------------------------------------*/
void AutoOperation_FunctionTest(void)
{
    uint32_t i;
    uint8_t *pu8Tmp;

    PDMA_DONE = 0;

    /* Build I2C write frame: SLV+W, register address, SLV+R */
    pu8Tmp = SrcArray;
    for (i = 0; i < SG_TX_TAB_NUM; i++)
    {
        *pu8Tmp++ = ((g_u8DeviceAddr << 1) | 0x00);   /* SLV + W              */
        *pu8Tmp++ = 0x00;                              /* Register address     */
        *pu8Tmp++ = ((g_u8DeviceAddr << 1) | 0x01);   /* SLV + R              */
    }

    /* Set I2C0 interrupt callback for master receive operation */
    s_I2C0HandlerFn = (I2C_FUNC)I2C_PDMA_MasterRx;

    I2C_SET_CONTROL_REG(I2C0, I2C_CTL_AA);

    /* PDMA CH0 scatter-gather mode to write data to slave */
    PDMA_TX_Init(I2C0_PDMA_TX_CH, SG_TX_TAB_NUM, SG_TX_LENGTH);

    /* PDMA CH1 scatter-gather mode to receive data from slave */
    PDMA_RX_Init(I2C0_PDMA_RX_CH, SG_RX_TAB_NUM, SG_RX_LENGTH);

    /* Auto operation random read mode with repeat start, triggered by TIMER1 */
    I2C_Trigger_Init(I2C_RANDOM_REPEAT_STA, I2C_AUTOCTL_TRIGSEL_TMR1, SG_RX_LENGTH, SG_TX_LENGTH);

    /* Wait for PDMA RX done (Timer1 triggers I2C auto-op every 1 second) */
    {
        uint32_t u32Timeout = SystemCoreClock;
        while (!PDMA_DONE)
        {
            if (u32Timeout-- == 0)
            {
                printf("PDMA timeout error!\\n");
                return;
            }
        }
    }

    printf("I2C0 Rx done\\n");

    /* Decode raw temperature data from NCT7712Y (12-bit, 0.0625 C/LSB) and print result */
    for (i = 0; i < SG_RX_TAB_NUM * 2; i += 2)
    {
        NCT7712Y_Data  = DestArray[i];
        NCT7712Y_Data <<= 8;
        NCT7712Y_Data |= DestArray[i + 1];

        NCT7712Y_Data >>= 4;                           /* bit0 ~ bit3 are reserved */

        /* Determine if the temperature is positive or negative */
        if (NCT7712Y_Data & 0x800)
        {
            /* Get NCT7712Y_Data 2's complement */
            NCT7712Y_Data = ~NCT7712Y_Data & 0x00000FFF;
            NCT7712Y_Data += 1;

            /* Get negative Celsius temperature value */
            NCT7712Y_Data_F = (float)(NCT7712Y_Data * -0.0625f);
        }
        else
        {
            /* Get positive Celsius temperature value */
            NCT7712Y_Data_F = (float)(NCT7712Y_Data * 0.0625f);
        }

        printf("Current Temperature = %.4f degrees Celsius.\\n", NCT7712Y_Data_F);
    }

    /* Adjust breathing speed via software divider (no IFACNT change, no stop/start needed) */
    if (NCT7712Y_Data_F > 27.0f)
    {
        g_u32BreathDiv = 5;    /* Fast: duty changes every 5 periods = 50ms, full cycle = 350ms */
        printf("Fast breathing\\n");
    }
    else
    {
        g_u32BreathDiv = 60;   /* Slow: duty changes every 60 periods = 600ms, full cycle = 4.2s */
        printf("Slow breathing\\n");
    }

    printf("\\n");
}

/*---------------------------------------------------------------------------------------------------------*/
/* Previously generated: SYS_Init                                                                          */
/*---------------------------------------------------------------------------------------------------------*/
void SYS_Init(void)
{
    /* Unlock protected registers */
    SYS_UnlockReg();

    /* Enable HIRC and LIRC clock sources */
    CLK_EnableXtalRC(CLK_PWRCTL_HIRCEN_Msk | CLK_PWRCTL_LIRCEN_Msk);

    /* Wait for HIRC and LIRC clock ready */
    CLK_WaitClockReady(CLK_STATUS_HIRCSTB_Msk);
    CLK_WaitClockReady(CLK_STATUS_LIRCSTB_Msk);

    /* Set HCLK clock source to HIRC with divider 1 */
    CLK_SetHCLK(CLK_CLKSEL0_HCLKSEL_HIRC, CLK_HCLKDIV_HCLK(1));

    /* Set PCLK0/PCLK1 to HCLK/2 */
    CLK->PCLKDIV = (CLK_PCLKDIV_APB0DIV_DIV2 | CLK_PCLKDIV_APB1DIV_DIV2);

    /* Update System Core Clock */
    SystemCoreClockUpdate();

    /* Select UART0 clock source as HIRC with divider 1 */
    CLK_SetModuleClock(UART0_MODULE, CLK_CLKSEL2_UART0SEL_HIRC, CLK_CLKDIV_UART0(1));

    /* Select TIMER0 clock source as LIRC (for PWM breathing LED, keeps running in power-down) */
    CLK_SetModuleClock(TMR0_MODULE, CLK_CLKSEL1_TMR0SEL_LIRC, MODULE_NoMsk);

    /* Select TIMER1 clock source as LIRC (for I2C auto-operation trigger, keeps running in power-down) */
    CLK_SetModuleClock(TMR1_MODULE, CLK_CLKSEL1_TMR1SEL_LIRC, MODULE_NoMsk);

    /* Enable peripheral clocks */
    CLK_EnableModuleClock(UART0_MODULE);
    CLK_EnableModuleClock(I2C0_MODULE);
    CLK_EnableModuleClock(TMR0_MODULE);
    CLK_EnableModuleClock(TMR1_MODULE);
    CLK_EnableModuleClock(PDMA0_MODULE);
    CLK_EnableModuleClock(GPA_MODULE);
    CLK_EnableModuleClock(GPB_MODULE);
    CLK_EnableModuleClock(GPC_MODULE);

    /*---------------------------------------------------------------------------------------------------------*/
    /* Init Multi-Function Pins                                                                                */
    /*---------------------------------------------------------------------------------------------------------*/

    /* Set PB13 as UART0_TXD (TX only, no RX pin to avoid leakage in power-down) */
    SYS->GPB_MFPH = (SYS->GPB_MFPH & ~SYS_GPB_MFPH_PB13MFP_Msk) | SYS_GPB_MFPH_PB13MFP_UART0_TXD;

    /* Set PC0 as I2C0_SDA, PC1 as I2C0_SCL */
    SYS->GPC_MFPL = (SYS->GPC_MFPL & ~(SYS_GPC_MFPL_PC0MFP_Msk | SYS_GPC_MFPL_PC1MFP_Msk)) |
                     (SYS_GPC_MFPL_PC0MFP_I2C0_SDA | SYS_GPC_MFPL_PC1MFP_I2C0_SCL);

    /* Enable Schmitt trigger on PC0 and PC1 for I2C noise immunity */
    PC->SMTEN |= (GPIO_SMTEN_SMTEN0_Msk | GPIO_SMTEN_SMTEN1_Msk);

    /* Set PB5 as TM0 PWM output for LED breathing effect */
    SYS->GPB_MFPL = (SYS->GPB_MFPL & ~SYS_GPB_MFPL_PB5MFP_Msk) | SYS_GPB_MFPL_PB5MFP_TM0;

    /* Lock protected registers */
    SYS_LockReg();
}

    TIMER_SetATriggerSource(TIMER1, TIMER_ATRGSRC_TIMEOUT_EVENT);
    TIMER_SetATriggerTarget(TIMER1, TIMER_ATRG_TO_IPS);

    /* 禁用 Timer0 本身喚醒 CPU (交由 PDMA 完成中斷喚醒) */
    TIMER_DisableWakeup(TIMER1);
}

/* 建立接收端 Scatter-gather 描述鏈結表 */
void Build_Rx_SCTab(uint32_t u32TabNum, uint32_t u32RxSize, uint32_t u32StartAddr)
{
    uint32_t i;
    for (i = 0; i < u32TabNum; i++)
    {
        DMA_DESC_SC_RX[i].ctl = PDMA_OP_SCATTER |
                                PDMA_REQ_SINGLE |
                                PDMA_SAR_FIX |            /* 來源端為固定的 I2C0->DAT */
                                PDMA_DAR_INC |            /* 目的端快取緩衝區累加 */
                                PDMA_WIDTH_8 |
                                PDMA_TBINTDIS_DISABLE |
                                ((u32RxSize - 1) << PDMA_DSCT_CTL_TXCNT_Pos);
        DMA_DESC_SC_RX[i].src    = (uint32_t)&(I2C0->DAT);
        DMA_DESC_SC_RX[i].dest   = (uint32_t)(u32StartAddr + i * u32RxSize);
        DMA_DESC_SC_RX[i].offset = (uint32_t)&DMA_DESC_SC_RX[0] + 0x10 * (i + 1) - (PDMA0->SCATBA);
    }

    /* 最後一個傳送點：啟用 Done 中斷並切換回 Basic 模式 */
    DMA_DESC_SC_RX[u32TabNum - 1].ctl = (DMA_DESC_SC_RX[u32TabNum - 1].ctl & ~(PDMA_DSCT_CTL_TBINTDIS_Msk | PDMA_DSCT_CTL_OPMODE_Msk)) |
                                        (PDMA_TBINTDIS_ENABLE | PDMA_OP_BASIC);
    DMA_DESC_SC_RX[u32TabNum - 1].offset = 0;
}`

        // HTML Character Escaping
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        // IMMUNE-TO-NESTED-CONFLICT TOKENIZER HIGHLIGHTER
        function highlightCCode(code) {
            // Clean non-breaking spaces before processing
            const cleanCode = code.replace(/\u00a0/g, ' ');
            
            const tokens = [];
            let i = 0;
            
            const keywords = new Set(['for', 'if', 'else', 'while', 'return', 'switch', 'case', 'break', 'default']);
            const types = new Set([
                'uint32_t', 'uint8_t', 'int32_t', 'float', 'void', 'int', 'int32_t',
                'typedef', 'struct', 'volatile', 'static', 'char', 'double', 
                'int16_t', 'uint16_t', 'DMA_DESC_T', 'I2C_FUNC'
            ]);

            while (i < cleanCode.length) {
                // 1. Multi-line Comments
                if (cleanCode.substr(i, 2) === '/*') {
                    let end = cleanCode.indexOf('*/', i + 2);
                    if (end === -1) end = cleanCode.length;
                    else end += 2;
                    tokens.push({ type: 'comment', val: cleanCode.substring(i, end) });
                    i = end;
                    continue;
                }
                // 2. Single-line Comments
                if (cleanCode.substr(i, 2) === '//') {
                    let end = cleanCode.indexOf('\n', i + 2);
                    if (end === -1) end = cleanCode.length;
                    tokens.push({ type: 'comment', val: cleanCode.substring(i, end) });
                    i = end;
                    continue;
                }
                // 3. Preprocessor Directive
                if (cleanCode[i] === '#') {
                    let end = i + 1;
                    while (end < cleanCode.length && /[a-zA-Z]/.test(cleanCode[end])) {
                        end++;
                    }
                    tokens.push({ type: 'preprocessor', val: cleanCode.substring(i, end) });
                    i = end;
                    continue;
                }
                // 4. Strings
                if (cleanCode[i] === '"' || cleanCode[i] === "'") {
                    let quote = cleanCode[i];
                    let end = i + 1;
                    while (end < cleanCode.length && cleanCode[end] !== quote) {
                        if (cleanCode[end] === '\\') end += 2; // escape sequences
                        else end++;
                    }
                    if (end < cleanCode.length) end++; // include enclosing quote
                    tokens.push({ type: 'string', val: cleanCode.substring(i, end) });
                    i = end;
                    continue;
                }
                // 5. Hex numbers
                if (cleanCode.substr(i, 2) === '0x' || cleanCode.substr(i, 2) === '0X') {
                    let end = i + 2;
                    while (end < cleanCode.length && /[0-9a-fA-F]/.test(cleanCode[end])) {
                        end++;
                    }
                    tokens.push({ type: 'number', val: cleanCode.substring(i, end) });
                    i = end;
                    continue;
                }
                // 6. Decimal numbers (including floating types like 27.0f or raw percentages)
                if (/[0-9]/.test(cleanCode[i])) {
                    let end = i + 1;
                    let hasDot = false;
                    while (end < cleanCode.length) {
                        if (/[0-9]/.test(cleanCode[end])) {
                            end++;
                        } else if (cleanCode[end] === '.' && !hasDot) {
                            hasDot = true;
                            end++;
                        } else if (/[fF]/.test(cleanCode[end])) {
                            end++; 
                            break;
                        } else {
                            break;
                        }
                    }
                    tokens.push({ type: 'number', val: cleanCode.substring(i, end) });
                    i = end;
                    continue;
                }
                // 7. Identifiers / Keywords / Types / Function calls
                if (/[a-zA-Z_]/.test(cleanCode[i])) {
                    let end = i + 1;
                    while (end < cleanCode.length && /[a-zA-Z0-9_]/.test(cleanCode[end])) {
                        end++;
                    }
                    let val = cleanCode.substring(i, end);
                    
                    // Peek if followed by parentheses to mark function call
                    let isFunc = false;
                    let peek = end;
                    while (peek < cleanCode.length && /\s/.test(cleanCode[peek])) {
                        peek++;
                    }
                    if (peek < cleanCode.length && cleanCode[peek] === '(') {
                        isFunc = true;
                    }

                    if (keywords.has(val)) {
                        tokens.push({ type: 'keyword', val });
                    } else if (types.has(val)) {
                        tokens.push({ type: 'type', val });
                    } else if (isFunc) {
                        tokens.push({ type: 'function', val });
                    } else {
                        tokens.push({ type: 'text', val });
                    }
                    i = end;
                    continue;
                }
                // 8. Plain text / Operators / Punctuation
                tokens.push({ type: 'text', val: cleanCode[i] });
                i++;
            }

            // Convert tokens into high-quality HTML
            return tokens.map(t => {
                const esc = escapeHtml(t.val);
                switch (t.type) {
                    case 'comment':
                        return `<span class="text-slate-500 italic">${esc}</span>`;
                    case 'preprocessor':
                        return `<span class="text-amber-500 font-semibold">${esc}</span>`;
                    case 'string':
                        return `<span class="text-emerald-400">${esc}</span>`;
                    case 'number':
                        return `<span class="text-cyan-400 font-mono">${esc}</span>`;
                    case 'keyword':
                        return `<span class="text-amber-400 font-semibold">${esc}</span>`;
                    case 'type':
                        return `<span class="text-rose-400 font-semibold">${esc}</span>`;
                    case 'function':
                        return `<span class="text-blue-400 font-semibold">${esc}</span>`;
                    default:
                        return esc;
                }
            }).join('');
        }
